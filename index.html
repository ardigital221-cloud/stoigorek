<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineTrack — Сервис учета и личной статистики сериалов/фильмов</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Умный трекер просмотренных сериалов и фильмов с личной статистикой, календарем релизов и ачивками. Масштабируемый движок для ваших коллекций.">
  <meta name="keywords" content="трекер сериалов, учет фильмов, статистика просмотров, календарь сериалов, CineTrack, ботаник, парфюмерия, рецепты">
  <meta name="author" content="Hexa-Studio">

  <!-- Inter for body, Space Grotesk for display headlines -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/tracker.css">
</head>
<body>

  <!-- Ambient Light Mesh Orbs (Glassmorphism backdrop) -->
  <div class="ambient-glow orb-left"></div>
  <div class="ambient-glow orb-right"></div>

  <!-- ===== sticky app header ===== -->
  <header class="app-header">
    <div class="container header-inner">
      <!-- Brand Logo -->
      <div class="logo-container">
        <div class="logo-badge">C</div>
        <span>CineTrack</span>
      </div>

      <!-- Session Profile Controls -->
      <div id="header-right">
        <!-- Rendered dynamically by UI.updateHeader() -->
      </div>
    </div>
  </header>

  <!-- ===== main spa root container ===== -->
  <main id="app-root">
    <!-- Content injected dynamically by UI.render() -->
  </main>

  <!-- ===== footer bar ===== -->
  <footer class="footer-section">
    <div class="container footer-inner">
      <div>
        <div class="logo-container" style="font-size: 1.1rem; margin-bottom: 5px; cursor: default;">
          <div class="logo-badge" style="width: 24px; height: 24px; font-size: 0.8rem;">C</div>
          <span>CineTrack</span>
        </div>
        <p style="color: var(--text-muted); font-size: 0.75rem;">© 2026 CineTrack & Hexa-Studio. Личный гид и органайзер ваших просмотров.</p>
      </div>
      <div class="footer-links">
        <a href="#about" onclick="alert('CineTrack MVP — это трекер сериалов и кино, позволяющий вести личные списки, получать достижения и смотреть детальную статистику.')">// О проекте</a>
        <a href="#terms" onclick="alert('Монетизация CineTrack включает подписочную модель Premium за 100 руб/мес и партнерские переходы CPA.')">// Монетизация</a>
      </div>
    </div>
  </footer>

  <!-- ===== modal dialog: add content form (dynamic fields) ===== -->
  <div class="modal-overlay" id="add-item-modal">
    <!-- Generated dynamically in UI.openAddModal() -->
  </div>

  <!-- ===== popup overlay: cpa referral loader redirect simulation ===== -->
  <div class="cpa-simulation-overlay" id="cpa-overlay">
    <div class="cpa-loader"></div>
    <div class="cpa-overlay-text">
      <!-- Simulated redirect details -->
    </div>
  </div>

  <!-- ===== achievement toast notification alert ===== -->
  <div class="achievement-toast" id="achievement-toast">
    <div class="toast-icon">🏆</div>
    <div class="toast-info">
      <h4>Достижение разблокировано!</h4>
      <p>Вы завершили цель и получили награду.</p>
    </div>
    <div class="toast-pts">+50 очков</div>
  </div>

  <!-- ===== core scripts loaded sequentially ===== -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
