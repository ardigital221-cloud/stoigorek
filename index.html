<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Series Universe — Твоя личная вселенная сериалов</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Умный трекер просмотренных сериалов, личная статистика, календарь релизов и подробная энциклопедия. Создай свою вселенную.">
  <meta name="keywords" content="трекер сериалов, вселенная сериалов, статистика просмотров, энциклопедия сериалов, Series Universe">
  <meta name="author" content="Hexa-Studio">
  <meta name="theme-color" content="#05050A">

  <!-- Inter for body, Space Grotesk for display headlines -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/tracker.css">
</head>
<body>

  <div class="cosmic-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>



  <!-- ===== sticky app header ===== -->
  <header class="app-header">
    <div class="header-inner" style="max-width: 1200px; margin: 0 auto; width: 100%; display: flex; justify-content: space-between; align-items: center;">
      <!-- Brand Logo -->
      <div class="logo-container" style="display: flex; align-items: center; gap: 10px;">
        <div class="logo-badge" style="background: linear-gradient(135deg, #6366f1, #8b5cf6);">SU</div>
        <span>Series Universe</span>
      </div>

      <!-- Navigation Tabs -->
      <nav id="main-nav" class="main-nav" style="display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;">
        <style>#main-nav::-webkit-scrollbar { display: none; }</style>
        <button class="nav-tab active" data-tab="tracker" style="white-space: nowrap;">Трекер</button>
        <button class="nav-tab" data-tab="profile" style="white-space: nowrap;">Моя вселенная</button>
        <button class="nav-tab" data-tab="encyclopedia" style="white-space: nowrap;">Энциклопедия</button>
      </nav>

      <!-- Session Profile Controls -->
      <div id="header-right">
        <!-- Rendered dynamically by UI.updateHeader() -->
      </div>
    </div>
  </header>

  <!-- ===== main spa root container ===== -->
  <main id="app-root">
    <!-- Content injected dynamically by UI.render() -->
  </main>

  <!-- ===== footer bar ===== -->
  <footer class="footer-section">
    <div class="container footer-inner">
      <div>
        <div class="logo-container" style="font-size: 1.1rem; margin-bottom: 5px; cursor: default;">
          <div class="logo-badge" style="width: 24px; height: 24px; font-size: 0.8rem; background: linear-gradient(135deg, #6366f1, #8b5cf6);">SU</div>
          <span>Series Universe</span>
        </div>
        <p style="color: var(--text-muted); font-size: 0.75rem;">© 2026 Series Universe. Личный гид и органайзер ваших просмотров.</p>
      </div>
      <div class="footer-links">
        <a href="#about" onclick="alert('Series Universe — это платформа для фанатов сериалов.')">// О проекте</a>
      </div>
    </div>
  </footer>

  <!-- ===== modal dialog: add content form (dynamic fields) ===== -->
  <div class="modal-overlay" id="add-item-modal">
    <!-- Generated dynamically in UI.openAddModal() -->
  </div>

  <!-- ===== modal dialog: settings api keys form ===== -->
  <div class="modal-overlay" id="settings-modal">
    <!-- Generated dynamically in UI.openSettingsModal() -->
  </div>

  <!-- ===== achievement toast notification alert ===== -->
  <div class="achievement-toast" id="achievement-toast">
    <div class="toast-info">
      <h4>Цель завершена!</h4>
      <p>Вы разблокировали награду.</p>
    </div>
    <div class="toast-pts">+50</div>
  </div>

  <!-- ===== core scripts loaded sequentially ===== -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
