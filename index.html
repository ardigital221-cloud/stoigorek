<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Series Universe — Твоя личная вселенная сериалов</title>
  
  <meta name="description" content="Умный трекер просмотренных сериалов. Создай свою вселенную.">
  <meta name="theme-color" content="#0d0d12">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/tracker.css">
</head>
<body>

  <!-- Background Ambient Glows -->
  <div class="ambient-background">
    <div class="glow glow-purple"></div>
    <div class="glow glow-blue"></div>
  </div>

  <!-- Highlighted word in the middle -->
  <div style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9999; background: rgba(124, 58, 237, 0.9); color: #fff; font-weight: bold; font-size: 3rem; padding: 20px 40px; border-radius: 15px; box-shadow: 0 0 30px rgba(124, 58, 237, 1); letter-spacing: 5px; text-align: center; backdrop-filter: blur(5px);">
    ВЯЧЕСЛАВ
  </div>

  <!-- MOBILE HEADER (Visible only on mobile) -->
  <header class="mobile-header">
    <div class="mobile-brand">
      <div class="logo">SU</div>
      <div class="brand-text">SERIES<br>UNIVERSE</div>
    </div>
    <div class="mobile-actions">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
    </div>
  </header>

  <!-- DESKTOP TOPBAR -->
  <header class="desktop-topbar">
    <div class="topbar-content">
      <div class="brand">
        <div class="logo">SU</div>
        <div class="brand-text">SERIES<br>UNIVERSE</div>
      </div>
      
      <nav class="top-nav" id="top-nav">
        <button class="nav-item active" data-tab="tracker">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Главная
        </button>
        <button class="nav-item" data-tab="tracker_list">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          Трекер
        </button>
        <button class="nav-item" data-tab="universe">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          Вселенная
        </button>
        <button class="nav-item" data-tab="encyclopedia">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          Энциклопедия
        </button>
        <button class="nav-item" data-tab="calendar">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          Календарь
        </button>
      </nav>

      <div class="topbar-actions">
        <div class="search-icon">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        <div class="avatar-small" id="desktop-user-avatar">
          <img src="https://i.pravatar.cc/150?u=test" alt="user" onerror="this.style.display='none'">
          <div class="avatar-fallback">T</div>
        </div>
      </div>
    </div>
  </header>

  <!-- DASHBOARD WRAPPER -->
  <div class="dashboard-wrapper">
    <!-- CENTER CONTENT -->
    <main class="content-root" id="app-root">
      <!-- Injected via JS based on active tab -->
    </main>
  </div>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <div class="bottom-nav-item active" data-tab="tracker">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Главная</span>
    </div>
    <div class="bottom-nav-item" data-tab="tracker_list">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      <span>Трекер</span>
    </div>
    <div class="bottom-nav-item" style="opacity: 1; transform: translateY(-10px);">
      <button class="btn btn-primary" id="mobile-add-btn" style="border-radius: 50%; width: 56px; height: 56px; padding: 0; box-shadow: 0 4px 20px var(--primary-glow); display: flex; align-items: center; justify-content: center; font-size: 24px;">+</button>
    </div>
    <div class="bottom-nav-item" data-tab="universe">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"></path></svg>
      <span>Вселенная</span>
    </div>
    <div class="bottom-nav-item" data-tab="profile">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Профиль</span>
    </div>
  </nav>

  <!-- MODALS & TOASTS -->
  <div class="modal-overlay" id="add-item-modal"></div>
  <div class="modal-overlay" id="settings-modal"></div>

  <div class="achievement-toast" id="achievement-toast">
    <div class="toast-info">
      <h4 id="toast-title">Цель завершена!</h4>
      <p id="toast-desc">Вы разблокировали награду.</p>
    </div>
    <div class="toast-pts" id="toast-pts">+50</div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
